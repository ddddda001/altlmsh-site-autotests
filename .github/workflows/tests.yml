name: Автотесты сайта

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"   # каждый день в 07:17 по Москве
  workflow_dispatch:
    inputs:
      base_url:
        description: "Адрес проверяемого сайта"
        default: "https://altlmsh.site"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check . && ruff format --check .
      - name: Тесты
        run: >
          pytest -v
          --base-url "${{ inputs.base_url || 'https://altlmsh.site' }}"
          --html=report.html --self-contained-html
          --screenshot only-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            report.html
            test-results/
